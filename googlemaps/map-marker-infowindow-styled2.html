<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Google Maps API Example</title>
    <style>
        /* we need to dimension/size the box holding our map */

        #mymap {
            width: 100%;
            height: 300px;
        }
    </style>
</head>

<body>
    <!-- this element is where our map will be drawn -->
    <div id="mymap">

    </div>
    <!-- we place our own custom code in a function called initMap -->
    <script>
        /* global google */

        async function initMap() {
            // JSON styles cannot be used together with a map ID, and advanced
            // markers require a map ID, so this example keeps the legacy Marker.
            const { Map, InfoWindow } = await google.maps.importLibrary("maps");
            const { Marker } = await google.maps.importLibrary("marker");

            // inside this function we can write the code to make a map

            // now we can perform the steps in javascript to create the map

            // step 1. define the geocoord (lat,long) for the center first
            var geocoord1 = {
                lat: 38.465098,
                lng: -122.7215907
            };

            // step 2. create a google Map object
            var map1 = new Map(
                // tell gmap the html element to draw map inside of
                document.getElementById('mymap'), {
                    // provide the center in latitude and longitude
                    center: geocoord1,
                    // set the zoom level for the map
                    zoom: 13,
                    styles: [
    {
        "featureType": "all",
        "elementType": "all",
        "stylers": [
            {
                "color": "#ff7000"
            },
            {
                "lightness": "69"
            },
            {
                "saturation": "100"
            },
            {
                "weight": "1.17"
            },
            {
                "gamma": "2.04"
            }
        ]
    },
    {
        "featureType": "all",
        "elementType": "geometry",
        "stylers": [
            {
                "color": "#cb8536"
            }
        ]
    },
    {
        "featureType": "all",
        "elementType": "labels",
        "stylers": [
            {
                "color": "#ffb471"
            },
            {
                "lightness": "66"
            },
            {
                "saturation": "100"
            }
        ]
    },
    {
        "featureType": "all",
        "elementType": "labels.text.fill",
        "stylers": [
            {
                "gamma": 0.01
            },
            {
                "lightness": 20
            }
        ]
    },
    {
        "featureType": "all",
        "elementType": "labels.text.stroke",
        "stylers": [
            {
                "saturation": -31
            },
            {
                "lightness": -33
            },
            {
                "weight": 2
            },
            {
                "gamma": 0.8
            }
        ]
    },
    {
        "featureType": "all",
        "elementType": "labels.icon",
        "stylers": [
            {
                "visibility": "off"
            }
        ]
    },
    {
        "featureType": "landscape",
        "elementType": "all",
        "stylers": [
            {
                "lightness": "-8"
            },
            {
                "gamma": "0.98"
            },
            {
                "weight": "2.45"
            },
            {
                "saturation": "26"
            }
        ]
    },
    {
        "featureType": "landscape",
        "elementType": "geometry",
        "stylers": [
            {
                "lightness": 30
            },
            {
                "saturation": 30
            }
        ]
    },
    {
        "featureType": "poi",
        "elementType": "geometry",
        "stylers": [
            {
                "saturation": 20
            }
        ]
    },
    {
        "featureType": "poi.park",
        "elementType": "geometry",
        "stylers": [
            {
                "lightness": 20
            },
            {
                "saturation": -20
            }
        ]
    },
    {
        "featureType": "road",
        "elementType": "geometry",
        "stylers": [
            {
                "lightness": 10
            },
            {
                "saturation": -30
            }
        ]
    },
    {
        "featureType": "road",
        "elementType": "geometry.stroke",
        "stylers": [
            {
                "saturation": 25
            },
            {
                "lightness": 25
            }
        ]
    },
    {
        "featureType": "water",
        "elementType": "all",
        "stylers": [
            {
                "lightness": -20
            },
            {
                "color": "#ecc080"
            }
        ]
    }
]
                }
            );

            // step 3. create a marker that is placed on the map
            var marker1 = new Marker({
                // 1. the position of the marker geocoord
                position: geocoord1,
                // 2. which google map js var to place marker inside
                map: map1,
                // 3. title to show when user points at marker
                title: 'I am a marker!'
            });

            // step 4. create the info window object using gmap api
            var info1 = new InfoWindow({
                content: '<h2>Welcome</h2><p>We are in the window</p>'
            });

            // step 5. define a click event on our marker to open iw
            marker1.addListener(
                // 1 kind of event as a string
                'click',
                // 2 a block of code contained in a function to run when event happens
                function() {
                    // tell the info window to open inside of our map
                    info1.open(
                        // 1 the map to open inside of
                        map1,
                        // 2 the geocoord/marker to open the window at
                        marker1
                    );
                }
            );
        }
    </script>
    <!-- Load the Maps JavaScript API.
         1) the API key is the key property
         2) v: "weekly" selects the latest weekly release
         Libraries load later with google.maps.importLibrary(). -->

        (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({
            key: "AIzaSyD-_UiEig5vsSyXlMbVQ1Bfci1Ymg7Y3uw",
            v: "weekly"
        });
    </script>
    <script>
        initMap();
    </script>
</body>

</html>
