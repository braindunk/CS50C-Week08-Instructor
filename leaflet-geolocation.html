<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Week 8: Map JavaScript Examples Using Leaflet</title>
    <style>
      /* make sure the html element that will contain map has some dimensions! */
      #map1 {
        width:100%;
        height:500px;
      }
    </style>
    <!-- 1. load Leaflet library css file -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="">
    <!-- 2. load Leaflet JavaScript library AFTER Leaflet's CSS file -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
  </head>
  <body>
    <div id="map1"></div>
    <!-- load your own custom JavaScript code -->
    <script src="leaflet-geolocation.js"></script>
  </body>
</html>
